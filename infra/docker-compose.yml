services:
  db:
    image: postgres:16-alpine
    container_name: zzpeo-db
    environment:
      POSTGRES_USER: zzpeo
      POSTGRES_PASSWORD: zzpeo
      POSTGRES_DB: zzpeo
    ports:
      - "5432:5432"
    volumes:
      - zzpeo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zzpeo"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zzpeo-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zzpeo.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - zzpeo-pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  zzpeo-pgdata:
  zzpeo-pgadmin-data:
